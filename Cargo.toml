[package]
name = "sharkpaint"
version = "0.1.3"
edition = "2021"
description = "Aplicación nativa de dibujo y pintura digital"
license = "GPL-3.0-only"
build = "build.rs"

[lib]
name = "sharkpaint"
path = "src/lib.rs"

[[bin]]
name = "SharkPaint"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
arboard = { version = "3", features = ["image-data"] }
eframe = "0.37"
epaint_default_fonts = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
png = "0.18"
rfd = "0.18"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
